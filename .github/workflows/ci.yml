# CI/CD: Lint & Test -> SonarQube analysis + Quality Gate -> Docker build -> Trivy scan (CRITICAL = fail)
#        -> push to GHCR -> GitOps bump of the Helm values (ArgoCD then deploys).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "deploy/helm/payment-api/values.yaml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/payment-api-sre

jobs:
  lint-test:
    name: Lint & unit tests (coverage >= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint & format check
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Pytest (fails under 85% coverage)
        run: pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.lcov

  policies:
    name: Helm lint & Gatekeeper policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/payment-api
      - name: gator verify (Rego unit tests)
        run: |
          curl -sSL https://github.com/open-policy-agent/gatekeeper/releases/download/v3.23.1/gator-v3.23.1-linux-amd64.tar.gz | tar xz
          ./gator verify -v policies/tests/
      - name: Rendered chart complies with the constraints
        run: |
          helm template payment-api deploy/helm/payment-api -n payment > rendered.yaml
          ./gator test -f policies/templates/ -f policies/constraints/ -f rendered.yaml

  sonarqube:
    name: SonarQube analysis & Quality Gate
    needs: lint-test
    # Runs even when the tests fail, so that the Quality Gate verdict is always reported.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      # Ephemeral SonarQube instance, configured by sonar/setup-sonarqube.sh (no external account needed).
      sonarqube:
        # 25.1 still ships the Python "Security Hotspot" rules (26.x reports them as vulnerabilities).
        image: sonarqube:25.1.0.102122-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Configure quality profile, quality gate and project
        id: setup
        run: echo "token=$(./sonar/setup-sonarqube.sh)" >> "$GITHUB_OUTPUT"
        env:
          SONAR_HOST_URL: http://localhost:9000
      - name: Scan and wait for the Quality Gate
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=${{ steps.setup.outputs.token }} \
            -e SONAR_USER_HOME=/usr/src/.scannerwork/.sonar \
            sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
      - name: Quality Gate report
        if: always()
        run: |
          curl -s -u "${{ steps.setup.outputs.token }}:" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=payment-api" \
            | python3 sonar/gate-report.py >> "$GITHUB_STEP_SUMMARY"

  build-scan-push:
    name: Docker build, Trivy scan, push
    needs: [sonarqube, policies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (fails on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.58.1 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:${{ steps.meta.outputs.tag }}"
      - name: Trivy full report (informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.58.1 image --no-progress --severity HIGH,CRITICAL \
            "$IMAGE:${{ steps.meta.outputs.tag }}" | tee trivy-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  gitops-update:
    name: GitOps - bump image tag (ArgoCD syncs)
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update deploy/helm/payment-api/values.yaml
        run: |
          TAG=${{ needs.build-scan-push.outputs.tag }}
          sed -i "s|^  tag: .*|  tag: \"$TAG\"|" deploy/helm/payment-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: payment-api $TAG [skip ci]" || echo "nothing to commit"
          git push
