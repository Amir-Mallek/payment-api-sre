# PayFlex API - intelligent CI/CD pipeline with a dynamic Quality Gate.
#
#   secrets-scan (Gitleaks: source + config) ─┐
#   lint-test (pytest + coverage) -> sonarqube ┼-> build-image (Docker, Trivy, Gitleaks on the artifact)
#   policies (helm lint + Gatekeeper) ────────┘      -> integration-tests (ephemeral container + Newman, log scan)
#                                                     -> performance-tests (k6)
#   quality-gate (always runs): aggregates every indicator -> quality report or incident report
#   deploy (main only, if the gate passed): push to GHCR + GitOps bump of the Helm values (ArgoCD syncs)
#
# Every stage classifies its own indicators with scripts/quality_gate.py:
#   WARNING (non-critical) -> ::warning annotation + job summary, the pipeline continues;
#   CRITICAL               -> the job fails, every following job is skipped (fail fast), nothing is deployed.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "deploy/helm/payment-api/values.yaml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/amir-mallek/payment-api-sre  # registry paths must be lowercase
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0

jobs:
  secrets-scan:
    name: "Confidentialité : Gitleaks (code + config)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gitleaks - source code and configuration files
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-source.json --exit-code 0
      - name: Confidentiality rate (must be 100 %)
        run: python3 scripts/quality_gate.py secrets source gitleaks-source.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-secrets-source
          path: gate-results/

  lint-test:
    name: "Tests unitaires + couverture"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint & format check
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Pytest (coverage report, hard stop under 70 %)
        run: pytest
      - name: Classify (coverage 70-80 % = warning, < 70 % or failed test = critical)
        if: always()
        run: python3 scripts/quality_gate.py unit junit.xml coverage.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.lcov
            junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-unit
          path: gate-results/

  policies:
    name: "Helm lint + politiques Gatekeeper"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/payment-api
      - name: gator verify (Rego unit tests)
        run: |
          curl -sSL https://github.com/open-policy-agent/gatekeeper/releases/download/v3.23.1/gator-v3.23.1-linux-amd64.tar.gz | tar xz
          ./gator verify -v policies/tests/
      - name: Rendered chart complies with the constraints
        run: |
          helm template payment-api deploy/helm/payment-api -n payment > rendered.yaml
          ./gator test -f policies/templates/ -f policies/constraints/ -f rendered.yaml

  sonarqube:
    name: "SonarQube + Quality Gate"
    needs: lint-test
    runs-on: ubuntu-latest
    services:
      # Ephemeral SonarQube instance, configured by sonar/setup-sonarqube.sh (no external account needed).
      sonarqube:
        # 25.1 still ships the Python "Security Hotspot" rules (26.x reports them as vulnerabilities).
        image: sonarqube:25.1.0.102122-community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports: ["9000:9000"]
    env:
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Configure quality profile, quality gate and project
        id: setup
        run: |
          TOKEN=$(./sonar/setup-sonarqube.sh)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Scan and wait for the Quality Gate
        env:
          SONAR_TOKEN: ${{ steps.setup.outputs.token }}
        run: |
          chmod -R a+rwX .   # the scanner image runs as its own non-root user
          docker run --rm --network host -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL -e SONAR_TOKEN sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
      - name: Classify (gate failed or blocking bug = critical, code smells = warning)
        if: always() && steps.setup.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ steps.setup.outputs.token }}
        run: |
          api() { curl -sf -H "Authorization: Bearer $SONAR_TOKEN" "$SONAR_HOST_URL/api/$1" || echo '{}'; }
          api "qualitygates/project_status?projectKey=payment-api" > sonar-gate.json
          api "issues/search?componentKeys=payment-api&resolved=false&types=BUG,VULNERABILITY&severities=BLOCKER,CRITICAL&ps=1" > sonar-blocking.json
          api "issues/search?componentKeys=payment-api&resolved=false&types=CODE_SMELL&ps=1" > sonar-smells.json
          python3 scripts/quality_gate.py sonar sonar-gate.json sonar-blocking.json sonar-smells.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-sonar
          path: gate-results/

  build-image:
    name: "Build Docker + Trivy + scan de l'artefact"
    needs: [secrets-scan, sonarqube, policies]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (CRITICAL CVE = fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:0.58.1 image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:${{ steps.meta.outputs.tag }}"
      - name: Gitleaks - artifact (application files and image metadata)
        run: |
          mkdir -p artifact
          cid=$(docker create "$IMAGE:${{ steps.meta.outputs.tag }}")
          docker cp "$cid:/srv/." artifact/srv
          docker inspect "$IMAGE:${{ steps.meta.outputs.tag }}" > artifact/image-config.json   # ENV, labels
          docker rm "$cid" >/dev/null
          cp .gitleaks.toml artifact/
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/artifact:/scan" "$GITLEAKS_IMAGE" \
            dir /scan --config /scan/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /scan/gitleaks-artifact.json --exit-code 0
          mv artifact/gitleaks-artifact.json .
      - name: Confidentiality rate of the artifact (must be 100 %)
        run: python3 scripts/quality_gate.py secrets artifact gitleaks-artifact.json
      - name: Save image for the test stages
        run: docker save "$IMAGE:${{ steps.meta.outputs.tag }}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-secrets-artifact
          path: gate-results/

  integration-tests:
    name: "Tests d'intégration : conteneur éphémère + Newman"
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Start the API in an ephemeral container
        run: |
          gunzip -c image.tar.gz | docker load
          docker run -d --name payflex -p 8000:8000 "$IMAGE:${{ needs.build-image.outputs.tag }}"
          for i in $(seq 30); do curl -sf http://localhost:8000/healthz && exit 0; sleep 1; done
          docker logs payflex; exit 1
      - name: Newman API scenario
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host -v "$PWD/postman:/etc/newman:ro" -v "$PWD/reports:/out" \
            postman/newman:6-alpine run payflex.postman_collection.json \
            --env-var baseUrl=http://localhost:8000 -r cli,json,junit \
            --reporter-json-export /out/newman-report.json --reporter-junit-export /out/newman-junit.xml
      - name: Classify (any failed assertion = critical regression)
        if: always()
        run: python3 scripts/quality_gate.py integration reports/newman-report.json
      - name: Gitleaks - application logs (no PAN, token or password logged)
        if: success()
        run: |
          mkdir -p logs && docker logs payflex > logs/payflex.log 2>&1
          cp .gitleaks.toml logs/
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/logs:/scan" "$GITLEAKS_IMAGE" \
            dir /scan --config /scan/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /scan/gitleaks-logs.json --exit-code 0
          python3 scripts/quality_gate.py secrets logs logs/gitleaks-logs.json
      - name: Stop the container
        if: always()
        run: docker rm -f payflex || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newman-report
          path: reports/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-integration
          path: gate-results/

  performance-tests:
    name: "Tests de performance k6"
    needs: [build-image, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Start the API in an ephemeral container
        run: |
          gunzip -c image.tar.gz | docker load
          docker run -d --name payflex -p 8000:8000 "$IMAGE:${{ needs.build-image.outputs.tag }}"
          for i in $(seq 30); do curl -sf http://localhost:8000/healthz && exit 0; sleep 1; done
          docker logs payflex; exit 1
      - uses: grafana/setup-k6-action@v1
      - name: k6 load test (aborts as soon as p95 > 500 ms or errors > 2 %)
        run: k6 run -e BASE_URL=http://localhost:8000 --summary-export=k6-summary.json k6/ci-perf.js
      - name: Classify (p95 200-500 ms = warning, > 500 ms or errors > 2 % = critical)
        if: always()
        run: python3 scripts/quality_gate.py perf k6-summary.json
      - name: Stop the container
        if: always()
        run: docker rm -f payflex || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-perf
          path: gate-results/

  quality-gate:
    name: "Quality Gate : classification + rapport"
    needs: [secrets-scan, lint-test, policies, sonarqube, build-image, integration-tests, performance-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          merge-multiple: true
          path: gate-results
      - name: Quality report / incident report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/quality_gate.py report gate-results --needs "$NEEDS" --out quality-report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report
          path: quality-report.md

  deploy:
    name: "Déploiement : push GHCR + GitOps (ArgoCD)"
    needs: [build-image, quality-gate]
    if: github.event_name != 'pull_request' && needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Push to GHCR
        run: |
          gunzip -c image.tar.gz | docker load
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ needs.build-image.outputs.tag }}"
      - name: GitOps - bump deploy/helm/payment-api/values.yaml
        run: |
          TAG=${{ needs.build-image.outputs.tag }}
          sed -i "s|^  tag: .*|  tag: \"$TAG\"|" deploy/helm/payment-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: payment-api $TAG [skip ci]" || echo "nothing to commit"
          git push
