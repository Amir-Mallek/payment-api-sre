# Runs the k6 test inside the cluster (no port-forward bottleneck) and pushes k6 metrics to Prometheus.
# kubectl -n loadtest create configmap k6-script --from-file=load-test.js
# kubectl apply -f job.yaml && kubectl -n loadtest logs -f job/k6-load-test
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: k6 }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "--out", "experimental-prometheus-rw", "--tag", "testid=payment-api-load", "/scripts/load-test.js"]
          env:
            - name: BASE_URL
              value: http://payment-api.payment.svc.cluster.local
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(50),p(95),p(99)"
          volumeMounts:
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
      volumes:
        - name: script
          configMap: { name: k6-script }
