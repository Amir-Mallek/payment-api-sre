# Tempo single binary; receives OTLP from the OpenTelemetry Collector.
tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }
persistence:
  enabled: true
  size: 5Gi
