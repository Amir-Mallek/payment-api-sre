# OpenTelemetry Collector (gateway): receives OTLP traces from the app and forwards them to Tempo.
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
fullnameOverride: otel-collector
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
ports:
  metrics:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    batch: {}
    k8s_attributes:
      extract:
        metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls: { insecure: true }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_grpc/tempo]
      metrics: null
      logs: null
presets:
  kubernetesAttributes:
    enabled: true
