# Gitleaks configuration of PayFlex (payment API): default rules (passwords, OAuth tokens, private keys,
# cloud/API keys...) + PII rules for card numbers. Used on the source tree, the Docker artifact and the logs.
title = "PayFlex confidentiality rules"

[extend]
useDefault = true

[[rules]]
id = "pii-card-number"
description = "PII: payment card number (PAN) in clear text"
regex = '''\b(?:4[0-9]{15}|4[0-9]{12}|5[1-5][0-9]{14}|2[2-7][0-9]{14}|3[47][0-9]{13})\b'''
tags = ["pii", "pci-dss"]

[allowlist]
description = "Known false positives: public test cards, public GPG fingerprint of the python base image"
regexes = [
  # GPG_KEY env of the official python image = fingerprint of the CPython release manager's PUBLIC key.
  '''7169605F62C751356D054A26A821E680E5FA6305''',
  # Test card numbers published by payment providers (not real cards).
  '''4111111111111111''',
  '''4111111111111112''',
  '''5555555555554444''',
  '''378282246310005''',
  '''4539148803436467''',
]
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
  '''coverage\.(xml|lcov)$''',
]
