# GitOps: ArgoCD keeps the cluster in sync with the main branch.
# The CI pipeline bumps image.tag in deploy/helm/payment-api/values.yaml, ArgoCD deploys it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Amir-Mallek/payment-api-sre.git
    targetRevision: main
    path: deploy/helm/payment-api
    helm:
      releaseName: payment-api
  destination:
    server: https://kubernetes.default.svc
    namespace: payment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
---
# Gatekeeper ConstraintTemplates and Constraints, also managed by GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Amir-Mallek/payment-api-sre.git
    targetRevision: main
    path: policies
    directory:
      recurse: true
      include: "{templates/*.yaml,constraints/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [SkipDryRunOnMissingResource=true]
