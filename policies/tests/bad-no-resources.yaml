# Must be REJECTED: no resources.requests / resources.limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-no-resources
  namespace: payment
spec:
  replicas: 1
  selector: { matchLabels: { app: bad-no-resources } }
  template:
    metadata: { labels: { app: bad-no-resources } }
    spec:
      containers:
        - name: web
          image: nginx:1.27.3
