# Must be REJECTED: uses the "latest" tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-latest-tag
  namespace: payment
spec:
  replicas: 1
  selector: { matchLabels: { app: bad-latest-tag } }
  template:
    metadata: { labels: { app: bad-latest-tag } }
    spec:
      containers:
        - name: web
          image: nginx:latest
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
