# Must be ACCEPTED: pinned tag, CPU/memory requests and limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: payment
spec:
  replicas: 1
  selector: { matchLabels: { app: good-deployment } }
  template:
    metadata: { labels: { app: good-deployment } }
    spec:
      containers:
        - name: web
          image: nginx:1.27.3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
