apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
  annotations:
    description: Forbids container images using the "latest" tag (explicit or implicit).
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        containers[c] {
          c := input.review.object.spec.containers[_]
        }
        containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
        containers[c] {
          c := input.review.object.spec.ephemeralContainers[_]
        }
        # Workloads (Deployment, StatefulSet, Job...) embed a pod template.
        containers[c] {
          c := input.review.object.spec.template.spec.containers[_]
        }
        containers[c] {
          c := input.review.object.spec.template.spec.initContainers[_]
        }
        containers[c] {
          c := input.review.object.spec.jobTemplate.spec.template.spec.containers[_]
        }

        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("container <%v> uses the forbidden tag 'latest' (image: %v)", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not has_tag_or_digest(c.image)
          msg := sprintf("container <%v> has no image tag, which implies 'latest' (image: %v)", [c.name, c.image])
        }

        has_tag_or_digest(image) {
          contains(image, "@")
        }
        has_tag_or_digest(image) {
          # The tag is after the last "/" (a registry port like host:5000/img is not a tag).
          parts := split(image, "/")
          contains(parts[count(parts) - 1], ":")
        }
