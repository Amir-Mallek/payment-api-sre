apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: require-requests-and-limits
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "kube-public", "kube-node-lease", "gatekeeper-system", "argocd", "monitoring"]
  parameters:
    fields: ["requests.cpu", "requests.memory", "limits.cpu", "limits.memory"]
